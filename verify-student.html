<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student verification — RENI NOW LEARNING</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{background:#2A2928;color:#F6F6F6;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;}
  .card{background:#34322F;border:1px solid #4A4743;border-radius:16px;padding:32px;max-width:360px;width:100%;text-align:center;}
  .badge{width:56px;height:56px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:26px;}
  .ok{background:rgba(143,201,138,.15);}
  .bad{background:rgba(230,138,122,.15);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:18px;margin-bottom:4px;}
  p{color:#B7B2A8;font-size:13px;margin-top:4px;}
  .name{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:14px 0 2px;}
  .meta{font-size:12px;color:#85807A;margin-top:14px;}
</style>
</head>
<body>
  <div class="card" id="card">
    <p>Checking…</p>
  </div>
<script>
  const id = new URLSearchParams(location.search).get('id');
  const card = document.getElementById('card');
  if (!id) {
    card.innerHTML = '<div class="badge bad">✕</div><h1>No student specified</h1>';
  } else {
    fetch('/api/verify/student/' + encodeURIComponent(id))
      .then(r => r.json())
      .then(data => {
        if (!data.valid) {
          card.innerHTML = '<div class="badge bad">✕</div><h1>Not found</h1><p>This QR code does not match a RENI NOW LEARNING student.</p>';
          return;
        }
        card.innerHTML = `
          <div class="badge ok">✓</div>
          <h1>Verified student</h1>
          <div class="name">${data.full_name || 'Student'}</div>
          <p>Role: ${data.role}</p>
          <div class="meta">Member since ${new Date(data.member_since).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })}</div>
        `;
      })
      .catch(() => {
        card.innerHTML = '<div class="badge bad">✕</div><h1>Could not verify</h1><p>Please try again later.</p>';
      });
  }
</script>
</body>
</html>
